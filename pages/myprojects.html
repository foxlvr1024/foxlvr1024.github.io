<body>
    
    <header>
        <section class="left">
            <h5>My Computer</h5>
        </section>
        <section class="right">
            <div class="btns">
                <img src="../pics/minimize.png" class="btns" id="minimize">
            </div>
            <div class="btns">
                <img src="../pics/maximise.png" class="btns" id="maximise">
            </div>
            <div class="btns right">
                <img src="../pics/close.png" class="btns" id="close">
            </div>
        </section>
    </header>
    
    <section class="main">
       <article class="banner">
            <div class="file" id="home">
                <p class="file">Home</p>
            </div>
            <div class="file" id="myprojects">
                <p class="file">MyProjects</p>
            </div>
            <div class="file" id="devlogs">
                <p class="file">Devlogs</p>
            </div>
            <div class="file" id="reviews">
                <p class="file">Reviews</p>
            </div>
            <div class="file" id="games">
                <p class="file">Games</p>
            </div>
        </article>

        <article class="middle">
            
            <div class="background">
                <div class="buttonplace">
                    <btn id="leftbtn">

                    </btn>
                </div>
                <div id="cards">
                    <div class="game" style="
                        border-color: red
                        ">
                        <img class="gameicon" src="../pics/wop.png">
                        <h1 class="name">Wizard of Protection</h1>
                        <btn class="play">PLAY</btn>
                    </div>
                    <div class="game" style="
                        border-color: #7b0630;
                        background-color: #010a27;
                        color: #ff9a54;
                        box-shadow: 0px 0px 50px 1px #c02358;
                        ">
                        <img class="gameicon" src="../pics/retro_kitchen.png">
                        <h1 class="name">Retro Kitchen</h1>
                        <btn class="play" style="
                        background-color: #fd3c7b;
                        border: 5px solid #ff68c6;
                        font-size: 3em;
                        border-radius: 15px;
                        
                        ">PLAY</btn>
                    </div>
                    <div class="game" style="
                        background-color: #696969;
                        border-color: #000000;
                        box-shadow: 0px 0px 50px 1px #000000;
                    ">
                        <img class="gameicon" style="
                        aspect-ratio: 315/250;
                        border: 5px solid #000000;
                        "src="../pics/funcx.png">
                        <h1 class="name" style="color:#f6f930">FuncX</h1>
                        <btn class="play" style="background-color: #002500; color: #f1dede">PLAY</btn>
                    </div>
                    <div class="game" style="display:none">
                        <img class="gameicon" src="../pics/System Properties.ico">

                        <btn class="play">play</btn>
                    </div>
                    <div class="game" style="
                    display:none;
                    border-color:yellow;
                    ">
                        <img class="gameicon" src="../pics/System Properties.ico">
                        <h1 class="name">Special theory of relativity - SIMULATION</h1>
                        <btn class="play">play</btn>
                    </div>
                    <div class="game">
                        <img class="gameicon" src="../pics/System Properties.ico">
                        <h1 class="name">ROBO</h1>
                        <btn class="play">play</btn>
                    </div>
                </div>
                <div class="buttonplace">
                    <btn id="rightbtn">

                    </btn>
                </div>
            </div>




            
            
        </article>

            <article class="startbtn" id="start">

            <a href="https://foxlvr1024.itch.io/">
                <article class="taskicon">
                    <img src="../pics/itchio.png" alt="t" class="icon" style="height: 20px;">
                </article>
            </a>
            <a href="https://x.com/foxlvr1024">
                <article class="taskicon">
                    <img src="../pics/Logo_of_Twitter.png" alt="t" class="icon">

            </a>
            <a href="https://bsky.app/profile/foxlvr1024.bsky.social">
                <article class="taskicon">
                    <img src="../pics/Bluesky_Logo.png" alt="t" class="icon">
                </article>
            </a>
            <a href="https://github.com/foxlvr1024">
                <article class="taskicon">
                    <img src="../pics/github-logo.png" alt="t" class="icon">
                </article>

        <section class="right">
            
            <p id="clock"></p>
            
        </section>
